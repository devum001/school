<html lang="en">

    <meta charset="UTF-8" />

    <meta name="theme-color" content="#19494d" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#12373b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Schoolwell" />

      content="Schoolwell — a thoughtful workspace for a thriving school. A connected workspace for school operations."

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/webp/256/graduation-cap.webp" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      window.__deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__deferredPrompt = e;
        window.dispatchEvent(new Event('pwa-prompt-ready'));
      });
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(function () {});
      }
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
